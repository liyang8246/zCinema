plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.134'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.11, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // Keep the 1.21.1 dev world away from the 1.21.11 one the main branch uses.
            gameDirectory = project.file('run-1.21.1')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    javacvRaw
    bytedecoBundle
}

def currentOs = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def currentArch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def arm64 = currentArch.contains("aarch64") || currentArch.contains("arm64")
def bytedecoPlatform = currentOs.contains("win") ? (arm64 ? "windows-arm64" : "windows-x86_64") :
        currentOs.contains("mac") ? (arm64 ? "macosx-arm64" : "macosx-x86_64") :
        (arm64 ? "linux-arm64" : "linux-x86_64")

def bundledPlatforms = ((project.findProperty('bundled_platforms') ?:
        'windows-x86_64,linux-x86_64,linux-arm64,macosx-x86_64,macosx-arm64')
        .toString().split(',')).collect { it.trim() }.findAll { !it.isEmpty() }

repositories {
    mavenCentral()
}

// JavaCV: strip module-info so the jar can be shaded/merged, then merge every requested
// native platform into the mod jar. Mirrors the approach used by Create Cinema.
def strippedJavaCv = tasks.register("strippedJavaCv", Jar) {
    archiveFileName = "javacv-${javacv_version}-stripped.jar"
    destinationDirectory = layout.buildDirectory.dir("stripped-libs")
    from({ configurations.javacvRaw.collect { zipTree(it) } })
    exclude "module-info.class"
    exclude "META-INF/versions/*/module-info.class"
    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    manifest {
        attributes("Automatic-Module-Name": "org.bytedeco.javacv")
    }
}

dependencies {
    javacvRaw("org.bytedeco:javacv:${javacv_version}") { transitive = false }
    implementation(files(strippedJavaCv))
    implementation("org.bytedeco:javacpp:${javacv_version}")
    implementation("org.bytedeco:ffmpeg:${ffmpeg_version}")
    localRuntime("org.bytedeco:javacpp:${javacv_version}")
    localRuntime("org.bytedeco:ffmpeg:${ffmpeg_version}")
    if (bundledPlatforms.contains(bytedecoPlatform)) {
        localRuntime("org.bytedeco:javacpp:${javacv_version}:${bytedecoPlatform}")
        localRuntime("org.bytedeco:ffmpeg:${ffmpeg_version}:${bytedecoPlatform}")
    }

    // Minecraft 1.21.8 and older only puts mods (and jars listed here) into the game's module
    // layer, so the decoder libraries have to be declared for dev runs explicitly.
    add('additionalRuntimeClasspath', files(strippedJavaCv))
    add('additionalRuntimeClasspath', "org.bytedeco:javacpp:${javacv_version}")
    add('additionalRuntimeClasspath', "org.bytedeco:ffmpeg:${ffmpeg_version}")
    if (bundledPlatforms.contains(bytedecoPlatform)) {
        add('additionalRuntimeClasspath', "org.bytedeco:javacpp:${javacv_version}:${bytedecoPlatform}")
        add('additionalRuntimeClasspath', "org.bytedeco:ffmpeg:${ffmpeg_version}:${bytedecoPlatform}")
    }

    bytedecoBundle("org.bytedeco:javacpp:${javacv_version}")
    bytedecoBundle("org.bytedeco:ffmpeg:${ffmpeg_version}")
}

// Gradle collapses multiple Maven classifiers for the same module in one configuration.
// Keep each target ABI in its own detached configuration so the fat jar receives every native.
def platformNativeBundles = bundledPlatforms.collect { platform ->
    def javacppNative = dependencies.create("org.bytedeco:javacpp:${javacv_version}:${platform}")
    def ffmpegNative = dependencies.create("org.bytedeco:ffmpeg:${ffmpeg_version}:${platform}")
    javacppNative.transitive = false
    ffmpegNative.transitive = false
    configurations.detachedConfiguration(javacppNative, ffmpegNative)
}

tasks.named('jar', Jar).configure {
    dependsOn strippedJavaCv
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property("bundledPlatforms", bundledPlatforms)
    inputs.files(platformNativeBundles)
    from({ zipTree(strippedJavaCv.get().archiveFile.get().asFile) }) {
        exclude "module-info.class"
        exclude "META-INF/versions/*/module-info.class"
        exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    }
    from({
        def artifacts = new ArrayList(configurations.bytedecoBundle.files)
        platformNativeBundles.each { bundle -> artifacts.addAll(bundle.files) }
        artifacts.collect { zipTree(it) }
    }) {
        exclude "module-info.class"
        exclude "META-INF/versions/*/module-info.class"
        exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
