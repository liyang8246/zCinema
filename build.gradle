plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

loom {
    runs {
        client {
            runDir "run-fabric"
        }
        server {
            runDir "run-fabric"
        }
    }
}

repositories {
    mavenCentral()
}

configurations {
    javacvRaw
    bytedecoBundle
}

// JavaCV: strip module-info so the jar can be shaded/merged, then merge every requested
// native platform into the mod jar. Mirrors the approach used by Create Cinema.
def strippedJavaCv = tasks.register("strippedJavaCv", Jar) {
    archiveFileName = "javacv-${javacv_version}-stripped.jar"
    destinationDirectory = layout.buildDirectory.dir("stripped-libs")
    from({ configurations.javacvRaw.collect { zipTree(it) } })
    exclude "module-info.class"
    exclude "META-INF/versions/*/module-info.class"
    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    manifest {
        attributes("Automatic-Module-Name": "org.bytedeco.javacv")
    }
}

def currentOs = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def currentArch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def arm64 = currentArch.contains("aarch64") || currentArch.contains("arm64")
def bytedecoPlatform = currentOs.contains("win") ? (arm64 ? "windows-arm64" : "windows-x86_64") :
        currentOs.contains("mac") ? (arm64 ? "macosx-arm64" : "macosx-x86_64") :
        (arm64 ? "linux-arm64" : "linux-x86_64")

def bundledPlatforms = ((project.findProperty('bundled_platforms') ?:
        'windows-x86_64,linux-x86_64,linux-arm64,macosx-x86_64,macosx-arm64')
        .toString().split(',')).collect { it.trim() }.findAll { !it.isEmpty() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    javacvRaw("org.bytedeco:javacv:${javacv_version}") { transitive = false }
    implementation(files(strippedJavaCv))
    implementation("org.bytedeco:javacpp:${javacv_version}")
    implementation("org.bytedeco:ffmpeg:${ffmpeg_version}")
    // Native decoders for the current dev platform; the released jar bundles its own set below.
    runtimeOnly("org.bytedeco:javacpp:${javacv_version}:${bytedecoPlatform}")
    runtimeOnly("org.bytedeco:ffmpeg:${ffmpeg_version}:${bytedecoPlatform}")

    bytedecoBundle("org.bytedeco:javacpp:${javacv_version}")
    bytedecoBundle("org.bytedeco:ffmpeg:${ffmpeg_version}")
}

// Gradle collapses multiple Maven classifiers for the same module in one configuration.
// Keep each target ABI in its own detached configuration so the fat jar receives every native.
def platformNativeBundles = bundledPlatforms.collect { platform ->
    def javacppNative = dependencies.create("org.bytedeco:javacpp:${javacv_version}:${platform}")
    def ffmpegNative = dependencies.create("org.bytedeco:ffmpeg:${ffmpeg_version}:${platform}")
    javacppNative.transitive = false
    ffmpegNative.transitive = false
    configurations.detachedConfiguration(javacppNative, ffmpegNative)
}

tasks.named('jar', Jar).configure {
    dependsOn strippedJavaCv
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property("bundledPlatforms", bundledPlatforms)
    inputs.files(platformNativeBundles)
    from({ zipTree(strippedJavaCv.get().archiveFile.get().asFile) }) {
        exclude "module-info.class"
        exclude "META-INF/versions/*/module-info.class"
        exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    }
    from({
        def artifacts = new ArrayList(configurations.bytedecoBundle.files)
        platformNativeBundles.each { bundle -> artifacts.addAll(bundle.files) }
        artifacts.collect { zipTree(it) }
    }) {
        exclude "module-info.class"
        exclude "META-INF/versions/*/module-info.class"
        exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}
