name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: spotlessCheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the gradle-wrapper.jar checksum on every run.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint (formatting) and build
        run: ./gradlew spotlessCheck build --stacktrace
