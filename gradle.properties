org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
neo_version_range=[21.1,)
loader_version_range=[4,)

# Mod Properties
mod_id=zcinema
mod_name=Z Cinema
mod_license=MIT
mod_version=1.0.0-1.21.1
mod_group_id=com.zfy.zcinema
mod_authors=LiYang
mod_description=A Create-free NeoForge mod for watching MP4 direct links together on a server.\nEvery player pulls the same stream from the source URL and stays in sync through play/pause/seek/stall events.

# JavaCV / FFmpeg (video decoding + audio decoding, no server relaying)
javacv_version=1.5.10
ffmpeg_version=6.1.1-1.5.10
# Platforms whose native libraries are bundled into the released jar.
bundled_platforms=windows-x86_64,linux-x86_64,linux-arm64,macosx-x86_64,macosx-arm64
