org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# Loom is happier without the configuration cache; keep it off for predictable builds.
org.gradle.configuration-cache=false

# Environment Properties
# Check https://fabricmc.net/develop for the latest versions.
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.14.10
fabric_api_version=0.116.17+1.21.1

# Mod Properties
mod_id=zcinema
mod_name=Z Cinema
mod_license=MIT
mod_version=1.0.2-fabric-1.21.1
mod_group_id=com.zfy.zcinema
mod_authors=LiYang
mod_description=A Create-free Fabric mod for watching MP4 direct links together on a server.\nEvery player pulls the same stream from the source URL and stays in sync through play/pause/seek/stall events.

# JavaCV / FFmpeg (video decoding + audio decoding, no server relaying)
javacv_version=1.5.10
ffmpeg_version=6.1.1-1.5.10
# Platforms whose native libraries are bundled into the released jar. Linux only ever runs the
# dedicated server here, which never decodes, so no Linux natives are needed.
bundled_platforms=windows-x86_64
